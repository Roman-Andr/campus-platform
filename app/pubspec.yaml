name: campus
description: "Campus: student community client for Android, web and desktop."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  clock: ^1.1.3
  connectivity_plus: ^7.3.2
  cupertino_ui: ^1.1.6
  dio: ^5.11.1
  dio_smart_retry: ^7.0.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  fresh_dio: ^0.6.0
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.11.0
  package_info_plus: ^10.2.2
  riverpod_annotation: ^4.0.8
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  analyzer: ^14.7.0
  build_runner: ^2.17.1
  connectivity_plus_platform_interface: ^2.1.0
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  riverpod_generator: ^4.0.10
  swagger_parser: ^2.1.1
  url_launcher_platform_interface: ^2.3.2

flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: false
  min_sdk_android: 26
  adaptive_icon_background: "#1E5AA8"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  web:
    generate: true
    background_color: "#1E5AA8"
    theme_color: "#1E5AA8"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
