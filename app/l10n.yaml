arb-dir: lib/l10n
template-arb-file: app_ru.arb
output-dir: lib/src/core/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
required-resource-attributes: true
format: true
# The first locale is the fallback for unsupported device languages.
preferred-supported-locales: [en, ru]
