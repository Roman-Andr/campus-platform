# Memory profile for machines with 8 GiB RAM shared with Flutter and the
# Android emulator. The Flutter template defaults (8 GiB heap, 4 GiB
# metaspace) target CI runners; override in ~/.gradle/gradle.properties
# only when a larger heap is really required.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Two workers keep AAPT2, R8 and other tasks from competing for the
# remaining RAM.
org.gradle.workers.max=2
# Kotlin compilation runs in a separate daemon: cap that JVM as well.
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
