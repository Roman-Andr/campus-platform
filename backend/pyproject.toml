[project]
name = "campus"
version = "0.1.0"
description = "Campus backend: API, worker and scheduler"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "asgi-correlation-id>=5.0.1",
    "asyncpg>=0.32.0",
    "babel>=2.18.0",
    "fastapi>=0.162.7",
    "packaging>=26.3",
    "pydantic-settings>=2.16.3",
    "sentry-sdk[fastapi]>=2.75.0",
    "sqlakeyset>=2.0.1787969905",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
campus-api = "campus.api.__main__:main"
campus-worker = "campus.worker.__main__:main"
campus-scheduler = "campus.scheduler.__main__:main"
campus-seed = "campus.seed.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "httpx2>=2.16.0",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "polyfactory>=3.5.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "testcontainers[postgres,redis]>=4.15.0",
    "time-machine>=3.6.0",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "ERA",   # commented-out code
    "F",     # pyflakes
    "FAST",  # FastAPI
    "G",     # flake8-logging-format
    "I",     # isort
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PERF",  # perflint
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RUF",   # ruff-specific
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

# The current time comes only from campus.core.clock (controlled in tests).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use campus.core.clock.now()."
"datetime.datetime.utcnow".msg = "Use campus.core.clock.now()."
"datetime.datetime.today".msg = "Use campus.core.clock.now()."
"datetime.date.today".msg = "Use campus.core.clock.now().date()."
"time.time".msg = "Use campus.core.clock.now(); time.monotonic() for durations."
"time.time_ns".msg = "Use campus.core.clock.now(); time.monotonic() for durations."

[tool.ruff.lint.per-file-ignores]
"src/campus/core/clock.py" = ["TID251"]
"src/campus/migrations/versions/*" = ["N999"] # file names sort by date
"tests/**" = [
    "PLR2004", # magic values in assertions
    "S101",    # assert
]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # Docker Desktop leaves a credential helper in ~/.docker/config.json that
    # is missing in WSL and containers; images used by tests are public.
    "ignore:docker-credential-.* not installed:UserWarning",
]

[tool.coverage.run]
# A path, not the package name: Alembic loads env.py and migration scripts
# under its own module names.
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    'if __name__ == "__main__":',
]

# Module boundaries (specification, 4.1). A domain module is a package under
# campus.modules; its __init__ is the public interface, its submodules are
# internal. Run with `uv run lint-imports`.
[tool.importlinter]
root_package = "campus"

[[tool.importlinter.contracts]]
name = "Processes depend on domain modules, modules on the shared kernel"
type = "layers"
layers = [
    "campus.api | campus.worker | campus.scheduler | campus.migrations | campus.seed",
    "campus.modules",
    "campus.core",
]

[[tool.importlinter.contracts]]
name = "Modules reach other modules only through their public interface"
type = "independence"
modules = ["campus.modules.*"]
# Imports of a module's package (its public interface) are allowed; what
# remains between modules are imports of their internals.
ignore_imports = ["campus.modules.** -> campus.modules.*"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Processes reach domain modules only through their public interface"
type = "forbidden"
source_modules = [
    "campus.api",
    "campus.worker",
    "campus.scheduler",
    "campus.migrations",
    "campus.seed",
]
forbidden_modules = ["campus.modules.*.*"]
allow_indirect_imports = true

# Migrations: run `uv run alembic <command>` from backend/; the database is
# CAMPUS_DATABASE_URL. Scripts live in the package, so they ship with it.
[tool.alembic]
script_location = "campus:migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = []
truncate_slug_length = 40
timezone = "UTC"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix --quiet REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format --quiet REVISION_SCRIPT_FILENAME"
