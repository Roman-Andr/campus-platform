global:
  scrape_interval: 15s
  scrape_timeout: 5s
scrape_configs:
  - job_name: campus-api
    static_configs:
      - targets: ["127.0.0.1:19001"]
  - job_name: campus-worker
    static_configs:
      - targets: ["127.0.0.1:19002"]
  - job_name: campus-scheduler
    static_configs:
      - targets: ["127.0.0.1:19003"]
