# Repository-wide checks. Language-specific hooks (ruff, dart format,
# eslint, ...) are added by the backend/, app/ and admin/ scaffolds.
# Setup: `pre-commit install` (pre-commit and pre-push hooks);
# run manually: `pre-commit run --all-files`.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        # drift_dev compares exported schemas byte for byte.
        exclude: ^app/drift_schemas/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(bat|cmd)$
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key
  # main changes only through pull requests. GitHub cannot enforce it in
  # this private repository (see .github/rulesets/), so refuse it locally;
  # the Main guard workflow reports pushes that bypass this hook.
  - repo: local
    hooks:
      - id: no-push-to-main
        name: no direct push to main
        entry: >-
          bash -c '[ "$PRE_COMMIT_REMOTE_BRANCH" != refs/heads/main ]
          || { echo "Pushing to main is not allowed: open a pull request."; exit 1; }'
        language: unsupported
        stages: [pre-push]
        always_run: true
        pass_filenames: false
  # Backend: tools run from backend/.venv at the versions pinned in uv.lock.
  - repo: local
    hooks:
      - id: backend-uv-lock
        name: backend uv.lock is up to date
        entry: uv lock --check --project backend
        language: unsupported
        files: ^backend/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: backend-ruff-check
        name: backend ruff check
        entry: uv run --project backend --frozen ruff check --fix
        language: unsupported
        types_or: [python, pyi]
        files: ^backend/
      - id: backend-ruff-format
        name: backend ruff format
        entry: uv run --project backend --frozen ruff format
        language: unsupported
        types_or: [python, pyi]
        files: ^backend/
      - id: backend-mypy
        name: backend mypy
        entry: uv run --directory backend --frozen mypy
        language: unsupported
        files: ^backend/(.*\.pyi?|pyproject\.toml)$
        pass_filenames: false
      - id: backend-import-linter
        name: backend import-linter
        entry: uv run --directory backend --frozen lint-imports
        language: unsupported
        files: ^backend/(.*\.py|pyproject\.toml)$
        pass_filenames: false
  # admin/: needs `npm ci` in admin/ first.
  - repo: local
    hooks:
      - id: admin-prettier
        name: admin prettier
        entry: npm --prefix admin run --silent format:check
        language: unsupported
        files: ^admin/
        pass_filenames: false
      - id: admin-eslint
        name: admin eslint
        entry: npm --prefix admin run --silent lint
        language: unsupported
        files: ^admin/.*\.(ts|tsx|js)$
        pass_filenames: false
      - id: admin-typecheck
        name: admin typecheck
        entry: npm --prefix admin run --silent typecheck
        language: unsupported
        files: ^admin/.*\.(ts|tsx|json)$
        pass_filenames: false
  # app/: needs Flutter on PATH and `flutter pub get` in app/ first.
  - repo: local
    hooks:
      - id: app-dart-format
        name: app dart format
        entry: dart format
        language: unsupported
        files: ^app/.*\.dart$
      - id: app-flutter-analyze
        name: app flutter analyze
        entry: bash -c 'cd app && flutter analyze --no-pub'
        language: unsupported
        files: ^app/(.*\.dart|pubspec\.(yaml|lock)|analysis_options\.yaml)$
        pass_filenames: false
