# Trial stack on a Linux operator machine, outside the Campus deployment.
name: campus-metrics-trial
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.listen-address=127.0.0.1:9090
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
  grafana:
    image: grafana/grafana:12.1.0
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set a trial password}
    volumes:
      - ./grafana:/etc/grafana/provisioning/datasources:ro
